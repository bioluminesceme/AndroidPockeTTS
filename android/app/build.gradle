apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'nl.user.pockettest'
    compileSdk = 34
    buildToolsVersion = '35.0.0'
    ndkVersion = '30.0.16248370'
    defaultConfig {
        applicationId = 'nl.user.pockettest'
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    // tools/build_android.py --bundle copies the runtime ZIP and voices here. Empty for a source-only build.
    sourceSets { main { assets.srcDirs += ['bundle-assets'] } }
    androidResources { noCompress += ['zip', 'pttsvoice'] }
    signingConfigs {
        // A release key is used only when PTTS_KEYSTORE is set. Otherwise the local debug key signs the APK.
        release {
            if (System.getenv('PTTS_KEYSTORE')) {
                storeFile = file(System.getenv('PTTS_KEYSTORE'))
                storePassword = System.getenv('PTTS_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('PTTS_KEY_ALIAS')
                keyPassword = System.getenv('PTTS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = System.getenv('PTTS_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
}
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        allWarningsAsErrors = true
    }
}
